<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Document</title>
</head>
<body>
    <video id="ekran" width="640" autoplay>

    </video>
    <p id="natija"></p>
    <button id="kamerani-yoq">
        KAMERANI YOQ
    </button>
    <button id="kamerani-uchir">
        KAMERANI O'chir
    </button>

    <script>
        const tugmaYOQ=document.getElementById("kamerani-yoq");
        let video=null;
        tugmaYOQ.addEventListener("click",async()=>{
        try{
            video=await navigator.mediaDevices.getUserMedia({video:true});
            document.getElementById("ekran").srcObject=video;
        }catch(err){
            document.getElementById("natija").innerText=`xatolik kelib chiqdi ${err}`;
        }            
        })

        document.getElementById("kamerani-uchir").addEventListener("click",()=>{
            if(video){
                video.getTracks().forEach(track=>track.stop());
                video=null;
            }
        })


    </script>
</body>
</html>
